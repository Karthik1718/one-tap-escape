plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.karthik'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.karthik"
        minSdk = 24
        targetSdk = 36
        versionCode = 12
        versionName = "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }

        // Load properties from local.properties
        def props = new Properties()
        if (file("../local.properties").exists()) {
            props.load(new FileInputStream(file("../local.properties")))
        }
        
        def admobAppId = props.getProperty("admob.app_id", "ca-app-pub-3940256099942544~3347511713")
        def admobRewardedId = props.getProperty("admob.rewarded_id", "ca-app-pub-3940256099942544/5224354917")
        def gamesAppId = props.getProperty("games.app_id", "0")
        def gamesLeaderboardId = props.getProperty("games.leaderboard_id", "")

        manifestPlaceholders = [admobAppId: admobAppId, gamesAppId: gamesAppId]
        buildConfigField "String", "ADMOB_REWARDED_ID", "\"${admobRewardedId}\""
        buildConfigField "String", "GAMES_LEADERBOARD_ID", "\"${gamesLeaderboardId}\""
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    buildTypes {
        release {
            // 1. Enabling this makes your app smaller and generates the 'mapping.txt' Google wants
            minifyEnabled = true 
            shrinkResources = true // Removes unused icons/layouts to save space
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // 2. This tells Gradle to include symbols for native code (like AdMob)
            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose = true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    
    // Fragment (Explicitly added to resolve outdated transitive version)
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    
    // AdMob
    implementation 'com.google.android.gms:play-services-ads:22.6.0'
    
    // Google Play Games Services (Leaderboards, Achievements)
    implementation 'com.google.android.gms:play-services-games-v2:20.1.2'
    
    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
